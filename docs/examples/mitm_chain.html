.mitre { display: inline-flex; gap: 8px; align-items: center; font-size: 13.5px; padding: 6px 10px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--attack) 35%, transparent); background: color-mix(in srgb, var(--attack) 7%, transparent); }
.mitre b { font-family: var(--mono); font-weight: 600; color: var(--attack); }
.tech { font: 13px/1.6 var(--mono); color: var(--muted); background: var(--bg-deep); border: 1px solid var(--line-soft); border-radius: 10px; padding: 12px 14px; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px 16px; margin: 10px 0 0; font-size: 13px; }
.metrics div { display: flex; flex-direction: column; }
.metrics dt { color: var(--faint); font-family: var(--mono); font-size: 11.5px; }
.metrics dd { margin: 0; overflow-wrap: anywhere; }
body:not(.expert) .expert-only { display: none !important; }
body.expert .beginner-only { display: none !important; }
.empty { padding: 34px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; }
.empty h3 { color: var(--ok); margin-bottom: 6px; }

/* ---------- network ---------- */
.net-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-top: 18px; }
.panel { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px; padding: 18px 20px; }
.panel h3 { font-size: 16px; margin-bottom: 12px; }
.hosts td:first-child { white-space: nowrap; }
.badge { display: inline-block; font-family: var(--sans); white-space: nowrap; font-size: 11.5px; font-weight: 600; padding: 2px 7px; margin: 0 4px 3px 0; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text); }
.badge.r-gateway { border-color: color-mix(in srgb, var(--ok) 55%, transparent); color: var(--ok); }
.badge.r-dns-server { border-color: color-mix(in srgb, var(--misconfig) 55%, transparent); color: var(--misconfig); }
.badge.r-dhcp-server { border-color: color-mix(in srgb, var(--fault) 55%, transparent); color: var(--fault); }
.badge.flag { border-color: color-mix(in srgb, var(--attack) 55%, transparent); color: var(--attack); }
.ext { color: var(--faint); font-size: 12px; }
.bars { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.bars li { display: grid; grid-template-columns: 120px minmax(0, 1fr) 84px; gap: 10px; align-items: center; font-size: 13.5px; }
.bars .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .lbl.mono { font-size: 12.5px; }
.bars .bar { height: 8px; border-radius: 999px; background: var(--line-soft); overflow: hidden; }
.bars .bar i { display: block; height: 100%; border-radius: 999px; background: var(--text); opacity: .75; }
.bars .val { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; }

/* ---------- capture ---------- */
.capture-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 7px 16px; margin: 0; font-size: 14px; }
.kv dt { color: var(--faint); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.warnlist { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 14px; }
.warnlist li { padding: 9px 12px; border-radius: 8px; background: color-mix(in srgb, var(--fault) 8%, transparent); border: 1px solid color-mix(in srgb, var(--fault) 30%, transparent); overflow-wrap: anywhere; }

/* ---------- footer, toast ---------- */
.footer { margin-top: 56px; padding: 26px 0 40px; border-top: 1px solid var(--line-soft); color: var(--faint); font-size: 13.5px; }
.footer .wrap { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.footer strong { color: var(--muted); font-weight: 600; }
.toast {
  position: fixed; left: 50%; bottom: 26px; z-index: 50; transform: translate(-50%, 20px); opacity: 0;
  background: var(--text); color: var(--bg); font-weight: 600; font-size: 14px;
  padding: 10px 16px; border-radius: 10px; transition: opacity .2s ease, transform .2s ease; pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- responsive ---------- */
@media (max-width: 1380px) { [data-embedded="1"] .navlinks { display: none; } [data-embedded="1"] .tools { margin-left: auto; } }
@media (max-width: 980px) {
  .navlinks { display: none; }
  .hero-grid { grid-template-columns: 1fr; gap: 20px; }
  .hero-side { flex-direction: row; align-items: center; }
  .gauge { max-width: 200px; }
  .incident { grid-template-columns: 1fr; }
  .incident-fix { border-left: 0; border-top: 1px solid var(--line-soft); }
  .cols, .net-grid, .capture-grid { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .tools .label { display: none; }
  .card-head { grid-template-columns: 1fr; }
  .hero-side { flex-direction: column; }
  .bars li { grid-template-columns: 90px minmax(0, 1fr) 70px; }
  .kv { grid-template-columns: 1fr; }
}

/* ---------- print (light) ---------- */
@media print {
  :root {
    --bg: #fff; --bg-deep: #f5f6f8; --surface: #fff; --surface-2: #f7f7f9; --line: #c9ced8; --line-soft: #dde1e8;
    --text: #141a24; --muted: #3e4756; --faint: #5d6778;
    --attack: #c62f22; --fault: #a8650a; --misconfig: #1f5fc4; --ok: #137a4c; --info: #5d6778;
    color-scheme: light;
  }
  body { font-size: 11.5pt; background: #fff; }
  .topbar, .toggle, .chips, .btn, .legend, .toast, .tooltip, .no-print { display: none !important; }
  .hero::before { display: none; }
  .card-body[hidden] { display: grid !important; }
  .expert-only { display: revert !important; }
  .incident, .reason, .block, tr { break-inside: avoid; box-shadow: none; }
  .section { padding-top: 22px; }
  .chart .trace { stroke: #141a24; }
  .gauge .value, .chart .trace, .chart .fill { animation: none !important; stroke-dashoffset: 0 !important; opacity: 1 !important; }
  .chart .trace { stroke-dasharray: none !important; }
  .chart .pin-label { fill: #fff; }
  .section-head, h2, h3, h4 { break-after: avoid; page-break-after: avoid; }
  .steps li::before { color: #fff; background: #141a24; }
  a { text-decoration: none; }
}
</style>

            h("td", { "class": "mono" }, ip, x.local === false ? h("div", { "class": "ext" }, "outside network") : null),
            h("td", null, arr(x.names).slice(0, 4).map(function (n, i) { return h("div", null, str(n)); })),
            h("td", { "class": "mono" }, macs.slice(0, 4).map(function (m) { return h("div", null, m); }),
              macs.length > 1 ? h("span", { "class": "badge flag" }, macs.length + " MACs for one IP") : null),
            h("td", null, arr(x.roles).map(function (r) {
              r = str(r);
              return h("span", { "class": "badge r-" + r.replace(/[^a-z-]/g, "") }, { "gateway": "Router", "dns-server": "DNS server", "dhcp-server": "DHCP server" }[r] || r);
            }), attackHosts[ip] ? h("span", { "class": "badge flag" }, "Suspect in " + attackHosts[ip].join(", ")) : null),
            h("td", { "class": "num" }, fmtInt(x.packets_sent)),
            h("td", { "class": "num" }, fmtInt(x.packets_recv)),
            h("td", { "class": "num" }, fmtBytes((num(x.bytes_sent) || 0) + (num(x.bytes_recv) || 0))));
        })))) : h("p", { "class": "more" }, "No devices were seen."),
      hs.length > shown.length ? h("p", { "class": "more" }, "Showing the " + shown.length + " busiest of " + fmtInt(hs.length) + " devices.") : null);

    var protos = obj(stats.protocols);
    var pkeys = Object.keys(protos).filter(function (k) { return num(protos[k]) !== null; });
    var ptotal = pkeys.reduce(function (a, k) { return a + protos[k]; }, 0) || 1;
    var prow = pkeys.sort(function (a, b) { return protos[b] - protos[a]; }).slice(0, 14).map(function (k) {
      return { label: k, v: protos[k], text: (100 * protos[k] / ptotal).toFixed(protos[k] / ptotal < 0.01 ? 2 : 1) + "%" };
    });
    var talk = arr(stats.top_talkers).filter(function (t) { return t && typeof t === "object"; }).slice(0, 10).map(function (t) {
      return { label: str(t.ip), v: num(t.bytes) || 0, text: fmtBytes(t.bytes) };
    });
    var convs = arr(stats.conversations).filter(function (c) { return c && typeof c === "object"; }).slice(0, 12);
    return h("section", { id: "network", "class": "section" },
      h("div", { "class": "wrap" },
        h("div", { "class": "section-head" }, h("div", null,
          h("h2", null, "Who was talking"),
          h("p", null, "Every device seen in the capture, what it does, and how much it sent."))),
        hostTable,
        h("div", { "class": "net-grid" },
          h("div", { "class": "panel" }, h("h3", null, "Protocols"), prow.length ? barsList(prow, false) : h("p", { "class": "more" }, "No protocol data.")),
          h("div", { "class": "panel" }, h("h3", null, "Busiest devices by data"), talk.length ? barsList(talk, true) : h("p", { "class": "more" }, "No traffic data."))),
        convs.length ? h("div", { "class": "panel", id: "conversations" },
          h("h3", null, "Busiest conversations"),
          h("div", { "class": "table-scroll" }, h("table", null,
            h("thead", null, h("tr", null, h("th", { scope: "col" }, "Between"), h("th", { scope: "col" }, "And"), h("th", { scope: "col" }, "Protocol"),
              h("th", { scope: "col", "class": "num" }, "Packets"), h("th", { scope: "col", "class": "num" }, "Data"))),
            h("tbody", null, convs.map(function (c) {
              return h("tr", null, h("td", { "class": "mono" }, str(c.a)), h("td", { "class": "mono" }, str(c.b)), h("td", null, str(c.proto)),
                h("td", { "class": "num" }, fmtInt(c.packets)), h("td", { "class": "num" }, fmtBytes(c.bytes)));
            }))))) : null));
  }

  // ------------------------------------------------------------ capture
  function captureSection() {
    var c = capture;
    var lt = arr(c.linktypes).map(function (x) { return ({ 0: "Null/loopback", 1: "Ethernet", 101: "Raw IP", 105: "802.11", 113: "Linux cooked", 127: "802.11 radiotap", 228: "Raw IPv4", 229: "Raw IPv6", 276: "Linux cooked v2" })[x] || ("type " + str(x)); });
    var rows = [
      ["File", str(c.name) || "unnamed"],
      ["Format", (str(c.format) || "?") + (c.compressed === true ? " (gzip compressed)" : "")],
      ["File size", fmtBytes(c.file_bytes)],
      ["Packets", fmtInt(c.packets) + (num(c.malformed_packets) ? " (" + fmtInt(c.malformed_packets) + " malformed)" : "")],
      ["Data captured", fmtBytes(c.bytes_captured)],
      ["Link type", lt.join(", ") || "?"],
      ["Started", fmtDate(c.first_ts)],
      ["Ended", fmtDate(c.last_ts)],
      ["Duration", fmtDur(c.duration)],
      ["SHA-256", str(c.sha256) || "?"],
      ["Report created", str(R.generated_at)]
    ];
    var warns = [];
    if (c.truncated === true) { warns.push("The file was truncated. Faultline analysed every complete packet before the cut."); }
    if (c.limited === true) { warns.push("A safety limit was reached, so only part of the file was analysed."); }
    warns = warns.concat(arr(c.warnings).map(str), arr(R.warnings).map(str));
    return h("section", { id: "capture", "class": "section" },
      h("div", { "class": "wrap" },
        h("div", { "class": "section-head" }, h("div", null,
          h("h2", null, "About this capture"),
          h("p", null, "The file Faultline read, and anything unusual about reading it."))),
        h("div", { "class": "capture-grid" },
          h("div", { "class": "panel" }, h("dl", { "class": "kv" }, rows.map(function (r) {
            return [h("dt", null, r[0]), h("dd", { "class": r[0] === "SHA-256" ? "mono" : null }, r[1])];
          }))),
          h("div", { "class": "panel" }, h("h3", null, "Reading notes"),
            warns.length ? h("ul", { "class": "warnlist" }, warns.slice(0, 50).map(function (w) { return h("li", null, w); }))
              : h("p", { "class": "more" }, "The file was read completely, with no problems.")))));
  }

  function footer() {
    return h("footer", { "class": "footer" },
      h("div", { "class": "wrap" },
        h("p", null, h("strong", null, "Generated offline by Faultline " + str(tool.version) + "."), " No data left this machine."),
        redacted ? h("p", null, "Privacy mode was on: addresses are pseudonymised and no raw packets are included.") :
          h("p", null, "This report contains addresses from your network. Re-run with redaction before sharing it publicly.")));
  }

  // -------------------------------------------------------------- mount
  var frag = doc.createDocumentFragment();
  append(frag, [topbar(), h("main", null, hero(), fixFirst(), findingsSection(), networkSection(), captureSection()), footer(), toastEl]);
  root.appendChild(frag);
  if (chartRedraw) {
    chartRedraw();
    var rt = null;
    window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(chartRedraw, 120); });
  }
  if (location.hash && /^#finding-[A-Za-z0-9_-]+$/.test(location.hash)) { goto(location.hash.slice(9)); }
})();
