.fd-head { padding: 20px 24px 0; display: grid; gap: 8px; border-left: 3px solid var(--c); }
.fd-head h3 { font-size: 22px; letter-spacing: -.02em; line-height: 1.2; }
.fd-summary { color: var(--muted); font-size: 14.5px; max-width: 80ch; }
.mitre { display: inline-flex; gap: 6px; align-items: center; color: var(--faint); font-size: 12px; }
.mitre b { font: 600 12px var(--mono); color: var(--text); background: var(--bg-deep); border: 1px solid var(--line-soft); border-radius: 5px; padding: 1px 6px; }
.tabs { display: flex; gap: 2px; padding: 14px 24px 0 27px; border-bottom: 1px solid var(--line-soft); overflow-x: auto; }
.tab { border: 0; background: transparent; color: var(--muted); padding: 8px 12px; font-size: 13.5px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; border-radius: 6px 6px 0 0; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); }
.fd-panel { padding: 20px 24px 24px 27px; display: grid; gap: 20px; }
.fd-panel[hidden] { display: none; }
.block h4 { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
.block p { font-size: 14.5px; max-width: 80ch; }
.block p + p { margin-top: 8px; }
.analogy { color: var(--muted) !important; padding-left: 12px; border-left: 2px solid var(--line); }
.hostlist { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.hostlist li { overflow-wrap: anywhere; }
.host-btn { font-size: 12.5px; background: var(--bg-deep); border: 1px solid var(--line-soft); border-radius: 6px; padding: 3px 7px; cursor: pointer; color: var(--text); }
.host-btn:hover { border-color: var(--line); }
.tech { font: 12.5px/1.6 var(--mono); color: var(--muted); background: var(--bg-deep); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 12px 14px; margin: 0 0 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px 16px; margin: 10px 0 0; font-size: 13px; }
.metrics div { display: flex; flex-direction: column; }
.metrics dt { color: var(--faint); font-size: 11.5px; }
.metrics dd { margin: 0; overflow-wrap: anywhere; }
.expert-only { display: none; }
body.expert .expert-only { display: initial; }
body.expert .tab.expert-only { display: inline-block; }
body.expert .beginner-only { display: none; }

/* ---------- why this verdict: the scoreboard ---------- */
.reason { display: grid; gap: 18px; }
.reason-head h4 { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
.reason .lead { font-size: 17px; font-weight: 600; letter-spacing: -.01em; max-width: 70ch; line-height: 1.35; }
.scoreboard { display: grid; gap: 10px; padding: 16px 18px; border-radius: 10px; background: var(--bg-deep); border: 1px solid var(--line-soft); }
.scorebar { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--line-soft); }
.scorebar i { display: block; height: 100%; background: var(--c); min-width: 0; }
.scorebar i + i { box-shadow: -2px 0 0 var(--bg-deep); }
.scorekey { display: flex; gap: 18px; margin: 0; padding: 0; list-style: none; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.scorekey li { display: inline-flex; align-items: center; gap: 7px; }
.scorekey i { width: 10px; height: 10px; border-radius: 2px; background: var(--c); }
.scorekey b { color: var(--text); font-size: 14px; }
.scorekey li.win span { color: var(--text); font-weight: 600; }
.hyps { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.hyp { padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line-soft); background: var(--surface-2); border-top: 2px solid var(--c); }
.hyp.win { background: color-mix(in srgb, var(--c) 7%, var(--surface-2)); }
.hyp h5 { margin: 0 0 10px; font-size: 13px; color: var(--c); display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
.hyp h5 .n { color: var(--faint); font-weight: 500; font-size: 11.5px; white-space: nowrap; }
.hyp ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.hyp li { display: grid; grid-template-columns: 34px 1fr; gap: 8px; font-size: 13.5px; align-items: baseline; line-height: 1.4; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--c); }
.dots i.half { background: linear-gradient(90deg, var(--c) 50%, var(--line) 50%); }
.whynot-wrap h5 { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
.whynot { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.whynot li { padding: 12px 14px; border-radius: 10px; border: 1px dashed var(--line); }
.wn-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.wn-head b { font-weight: 600; }
.whynot p { color: var(--muted); font-size: 13.5px; }

/* ---------- evidence ---------- */
.evidence-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.filter { display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; }
.filter-label { color: var(--faint); font-size: 12px; }
.filter code { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: middle; font-size: 12px; }
.evidence-foot { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
.hosts-line { margin-top: 10px; }
.table-scroll { overflow-x: auto; border: 1px solid var(--line-soft); border-radius: 10px; background: var(--bg-deep); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--faint); font-size: 11.5px; padding: 8px 12px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; background: var(--surface); }
td { padding: 7px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: top; overflow-wrap: anywhere; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: color-mix(in srgb, var(--text) 3%, transparent); }
th.num, td.num { text-align: right; white-space: nowrap; }
td.num { font-family: var(--mono); font-size: 12.5px; }
td.mono { font-size: 12.5px; }
.packets td.mono:last-child { white-space: pre-wrap; }
.hosts .ext { color: var(--faint); font: 11px var(--sans); }
.ev-groups { display: grid; gap: 14px; }
.ev-group { border-left: 3px solid var(--c); }
.ev-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
.ev-head h3 { font-size: 16px; margin-top: 6px; }
.ev-head .linkish { text-decoration: none; }
.ev-head .linkish:hover { text-decoration: underline; }
.ev-head .evidence-tools { margin: 0; }

/* ---------- network ---------- */
.map-panel { padding: 16px 18px 14px; }
.map-head { display: flex; align-items: baseline; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 10px; }
.map-head h3 { font-size: 14px; }
.map-head p { color: var(--muted); font-size: 12.5px; max-width: 70ch; }

/* ---------- capture ---------- */
.capture-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.capture-col { display: grid; gap: 16px; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 9px 16px; margin: 0; font-size: 13.5px; }
.kv dt { color: var(--faint); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.warnlist { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 13.5px; }
.warnlist li { padding: 8px 12px; border-radius: var(--r); background: color-mix(in srgb, var(--fault) 8%, transparent); border: 1px solid color-mix(in srgb, var(--fault) 30%, transparent); overflow-wrap: anywhere; }
.bars { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.bars li { display: grid; grid-template-columns: 120px minmax(0, 1fr) 76px; gap: 10px; align-items: center; font-size: 13px; }
.bars .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .lbl.mono { font-size: 12px; }
.bars .bar { height: 6px; border-radius: 999px; background: var(--line-soft); overflow: hidden; }
.bars .bar i { display: block; height: 100%; border-radius: 999px; background: var(--muted); }
.bars .val { text-align: right; color: var(--muted); font-size: 12.5px; }
.foot-note { color: var(--faint); font-size: 12.5px; }
.foot-note strong { color: var(--muted); }

/* ---------- motion ---------- */
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes sweep { from { stroke-dashoffset: var(--arc); } }
@media (prefers-reduced-motion: no-preference) {
  .chart .trace.draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.4s cubic-bezier(.3, .6, .2, 1) .1s forwards; }
  .chart .fill.draw { opacity: 0; animation: fade .8s ease 1s forwards; }
  .gauge .value.draw { animation: sweep 1.1s cubic-bezier(.3, .6, .2, 1) .1s backwards; }
}
@media (prefers-reduced-motion: reduce) { .view { animation: none; } .views { scroll-behavior: auto; } * { transition-duration: 0s !important; } }

/* ---------- responsive ---------- */
.scrim { display: none; }
@media (max-width: 1180px) {
  :root { --side-w: 60px; }
  .side { padding: 14px 8px; align-items: center; }
  .brand .brand-name, .nav-label, .nav-count, .side-foot { display: none; }
  .nav-item { justify-content: center; padding: 10px; }
  .brand { padding: 4px; }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ov-bottom, .capture-grid { grid-template-columns: 1fr; }
  .fl { grid-template-columns: minmax(260px, 320px) minmax(0, 1fr); }
  .tools .label { display: none; }
}
@media (max-width: 1280px) {
  .btn .label { display: none; }
  .crumb-name { max-width: 20ch; }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0 auto 0 0; width: 232px; z-index: 40; transform: translateX(-100%); transition: transform .2s ease; align-items: stretch; padding: 14px 12px; }
  .brand .brand-name, .nav-label, .nav-count, .side-foot { display: initial; }
  .nav-item { justify-content: flex-start; padding: 8px 10px; }
  .nav-count { display: inline-block; }
  body.nav-open .side { transform: none; }
  body.nav-open .scrim { display: block; position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .5); }
  .topbar .menu { display: inline-flex; }
  .topbar { padding: 0 14px; gap: 10px; }
  .health, .crumb-label { display: none; }
  .views { padding: 16px 14px 32px; }
  .verdict-card, .incident, .fl { grid-template-columns: 1fr; }
  .verdict-gauge { justify-self: start; }
  .fl-side { position: static; }
  .fl-list { max-height: 300px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* ---------- print ---------- */
@media print {
  :root { --bg: #fff; --bg-deep: #f5f6f8; --surface: #fff; --surface-2: #f3f4f6; --line: #c9ced6; --line-soft: #dde1e7; --text: #111; --muted: #444; --faint: #666; color-scheme: light; }
  html, body { height: auto; overflow: visible; }
  .shell { display: block; }
  .side, .topbar .tools, .topbar .menu, .toast, .scrim, .tabs, .fl-tools, .chart .cursor { display: none !important; }
  .stage { display: block; }
  .views { overflow: visible; padding: 0; }
  .view, .view[hidden] { display: grid; margin-bottom: 28px; page-break-inside: avoid; animation: none; opacity: 1; }
  .fd-panel[hidden], .fl-item[hidden] { display: grid; }
  .fl { grid-template-columns: 1fr; }
  .fl-list { max-height: none; overflow: visible; }
  .btn, .kpi, .fl-item { border-color: #c9ced6; }
  .map-box .tooltip, .term .tip { display: none !important; }
  .netmap .node .body { fill: #fff; }
}

/* ---------- timeline chart (SVG) ---------- */
.chart { position: relative; min-height: 150px; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart .grid { stroke: var(--line-soft); stroke-width: 1; }
.chart .axis { fill: var(--faint); font: 11px var(--mono); }
.chart .trace { fill: none; stroke: var(--text); stroke-width: 1.6; stroke-linejoin: round; }
.chart .fill { fill: url(#fl-trace-fill); }
.chart stop.s0 { stop-color: var(--status); stop-opacity: .26; }
.chart stop.s1 { stop-color: var(--status); stop-opacity: 0; }
.k-attack { fill: var(--attack); stroke: var(--attack); --c: var(--attack); }
.k-fault { fill: var(--fault); stroke: var(--fault); --c: var(--fault); }
.k-misconfig { fill: var(--misconfig); stroke: var(--misconfig); --c: var(--misconfig); }
.k-info { fill: var(--info); stroke: var(--info); --c: var(--info); }
.chart .band { stroke: none; }
.chart .stem { stroke-width: 1; opacity: .55; fill: none; }
.chart .pin rect { stroke: var(--bg-deep); stroke-width: 2; }
.chart .band { opacity: .07; }
.chart .band.hot { opacity: .2; }
.chart .lane { opacity: .85; }
.chart .lane.hot { opacity: 1; stroke: var(--text); stroke-width: 1; }
.chart .pin { cursor: pointer; }
.chart .pin-label { font: 700 11px var(--sans); fill: var(--bg-deep); stroke: none; pointer-events: none; }
.chart .cursor { stroke: var(--focus); stroke-width: 1; opacity: 0; pointer-events: none; }
.chart.hovering .cursor { opacity: .8; }
.tooltip {
  position: absolute; top: 0; z-index: 3; pointer-events: none; opacity: 0;
  min-width: 170px; max-width: 280px; padding: 8px 10px; border-radius: 8px;
  background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
}
.chart.hovering .tooltip { opacity: 1; }
.tooltip b { font-family: var(--mono); font-weight: 600; }
.tooltip ul { margin: 4px 0 0; padding: 0; list-style: none; }
.tooltip li { display: flex; gap: 6px; align-items: baseline; color: var(--muted); }
.tooltip li::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 2px; background: var(--c); transform: translateY(-1px); }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; padding: 0; list-style: none; }
.legend button {
  display: inline-flex; align-items: center; gap: 7px; max-width: 360px;
  border: 1px solid var(--line-soft); background: var(--surface); border-radius: 999px;
  padding: 3px 11px 3px 4px; font-size: 12.5px; color: var(--muted); cursor: pointer;
}
.legend button:hover { color: var(--text); border-color: var(--line); }
.legend .fid { font: 600 11px/1 var(--mono); color: var(--bg); background: var(--c); border-radius: 999px; padding: 4px 6px; }
.legend .ltxt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }


/* ---------- glossary tooltips ---------- */
.term { position: relative; text-decoration: underline dotted; text-decoration-color: color-mix(in srgb, var(--misconfig) 70%, transparent); text-underline-offset: 3px; text-decoration-thickness: 1.5px; cursor: help; border-radius: 3px; }
.term:hover, .term:focus-visible { text-decoration-style: solid; color: var(--text); }
.term .tip {
  position: absolute; left: 0; bottom: calc(100% + 8px); z-index: 30; width: 290px; max-width: 70vw;
  padding: 9px 11px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line);
  color: var(--text); font: 400 13px/1.45 var(--sans); font-style: normal; text-decoration: none;
  box-shadow: 0 10px 28px rgba(0, 0, 0, .45); opacity: 0; visibility: hidden; transform: translateY(4px);
  transition: opacity .12s ease, transform .12s ease; pointer-events: none; white-space: normal; text-align: left;
}
.term .tip.left { left: auto; right: 0; }
.term .tip::after { content: ""; position: absolute; left: 14px; top: 100%; border: 6px solid transparent; border-top-color: var(--line); }
.term .tip.left::after { left: auto; right: 14px; }
.term:hover .tip, .term:focus .tip, .term:focus-visible .tip { opacity: 1; visibility: visible; transform: none; }
body.expert .term { text-decoration: none; cursor: inherit; }
body.expert .term .tip { display: none; }

/* ---------- network map (SVG) ---------- */
.map-box { position: relative; background: var(--bg-deep); border: 1px solid var(--line-soft); border-radius: 12px; overflow: hidden; }
.netmap { display: block; width: 100%; height: auto; max-height: 520px; margin: 0 auto; font-family: var(--sans); }
.netmap .cloud { fill: url(#fl-cloud); stroke: var(--line-soft); stroke-dasharray: 4 5; }
.netmap stop.c0 { stop-color: var(--misconfig); stop-opacity: .14; }
.netmap stop.c1 { stop-color: var(--misconfig); stop-opacity: .02; }
.netmap .cloud-label { fill: var(--faint); font: 600 12px var(--sans); letter-spacing: .08em; text-transform: uppercase; }
.netmap .edge { stroke: var(--line); stroke-linecap: round; opacity: .9; transition: opacity .15s ease, stroke .15s ease; }
.netmap .edge.faint { stroke-dasharray: 3 6; opacity: .55; }
.netmap .edge.hot { stroke: var(--focus); opacity: 1; }
.map-box.hovering .edge:not(.hot), .map-box.has-selection .edge:not(.hot) { opacity: .25; }
.netmap .node { cursor: pointer; outline: none; }
.netmap .node .halo { fill: var(--c, transparent); opacity: 0; transition: opacity .15s ease; }
.netmap .node .body { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.5; transition: stroke .15s ease; }
.netmap .node .glyph { fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.netmap .node .label { fill: var(--text); font: 500 11.5px var(--mono); }
.netmap .node .sublabel { fill: var(--faint); font: 500 10.5px var(--sans); }
.netmap .node .count { fill: var(--faint); font: 500 11px var(--sans); }
.netmap .node.k-gateway .body { fill: var(--surface); stroke: var(--ok); stroke-width: 2; }
.netmap .node.k-gateway .glyph { stroke: var(--ok); }
.netmap .node.k-gateway .label { font-size: 12.5px; font-weight: 600; }
.netmap .node.k-hub .body { fill: none; stroke-dasharray: 4 4; }
.netmap .node.k-cloud .body { fill: transparent; stroke: none; }
.netmap .node.k-cloud .glyph { stroke: var(--misconfig); stroke-width: 1.8; fill: color-mix(in srgb, var(--misconfig) 18%, transparent); }
.netmap .node.k-external .body { fill: var(--bg); }
.netmap .node.k-more .body { stroke-dasharray: 3 3; }
.netmap .node.k-more .glyph { stroke-width: 2.4; }
.netmap .node.flag .body { stroke: var(--c); stroke-width: 2.2; }
.netmap .node.flag .glyph { stroke: var(--c); }
.netmap .node.flag .halo { opacity: .12; }
.netmap .node:hover .halo, .netmap .node:focus-visible .halo, .netmap .node.selected .halo { opacity: .28; fill: var(--c, var(--focus)); }
.netmap .node:focus-visible .body { stroke: var(--focus); }
.netmap .node.selected .body { stroke: var(--focus); stroke-width: 2.5; }
.netmap .node.peer .body { stroke: var(--focus); }
.netmap .fbadge circle { fill: var(--c); stroke: var(--bg-deep); stroke-width: 2; }
.netmap .fbadge text { fill: var(--bg-deep); font: 700 10.5px var(--sans); }
.netmap .rbadge rect { fill: var(--bg-deep); stroke-width: 1; }
.netmap .rbadge text { font: 700 8.5px var(--sans); letter-spacing: .02em; }
.netmap .rbadge.b-dns rect { stroke: var(--misconfig); } .netmap .rbadge.b-dns text { fill: var(--misconfig); }
.netmap .rbadge.b-dhcp rect { stroke: var(--fault); } .netmap .rbadge.b-dhcp text { fill: var(--fault); }
.netmap .rbadge.b-rtr rect { stroke: var(--ok); } .netmap .rbadge.b-rtr text { fill: var(--ok); }
.map-box .tooltip { max-width: 320px; min-width: 200px; }
.map-box.hovering .tooltip { opacity: 1; }
.map-tip .names { color: var(--muted); margin-top: 1px; overflow-wrap: anywhere; }
.map-tip dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 6px 0 0; }
.map-tip dt { color: var(--faint); }
.map-tip dd { margin: 0; overflow-wrap: anywhere; }
.map-tip .warn { color: var(--attack); }
.map-tip .hint { margin-top: 6px; color: var(--faint); font-size: 12px; }
.map-tip ul { margin-top: 6px; }
.map-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 12px 0 0; padding: 0; list-style: none; font-size: 12.5px; color: var(--muted); }
.map-legend li { display: inline-flex; align-items: center; gap: 7px; }
.map-legend i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface-2); flex: none; }
.map-legend .l-router i { border-color: var(--ok); border-width: 2px; }
.map-legend .l-ext i { background: var(--bg); border-color: var(--misconfig); border-style: dashed; }
.map-legend .l-attack i { border-color: var(--attack); background: color-mix(in srgb, var(--attack) 25%, var(--surface-2)); }
.map-legend .l-fault i { border-color: var(--fault); background: color-mix(in srgb, var(--fault) 25%, var(--surface-2)); }
.map-legend .l-misconfig i { border-color: var(--misconfig); background: color-mix(in srgb, var(--misconfig) 25%, var(--surface-2)); }
.map-legend .l-edge i { width: 22px; height: 0; border: 0; border-top: 3px solid var(--line); border-radius: 2px; }
.map-legend .l-badge i { width: auto; height: auto; border-radius: 4px; border-color: var(--misconfig); background: var(--bg-deep); font: 700 8px var(--sans); color: var(--misconfig); padding: 1px 4px; }
.map-legend .l-badge i::before { content: "DNS"; }
.map-text { margin-top: 10px; font-size: 13px; color: var(--muted); }
.map-text summary { cursor: pointer; color: var(--faint); }
.map-text ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 3px; font-family: var(--mono); font-size: 12px; }
</style>
</head>

  }
